; Torrador de café (pipoqueira modificada) - firmware v0.1 de teste do circuito

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 3 MB para o programa + ~900 KB de LittleFS (perfis e última torra); sem OTA
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
; Credenciais de Wi-Fi vêm do arquivo .env (veja .env.example)
extra_scripts = pre:scripts/load_env.py

; ESP32 clássico (DevKit / WROOM-32) - a placa atual
[env:esp32dev]
board = esp32dev

; ESP32-S3 DevKitC-1 (caso troque de placa)
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
; Se a placa só tem a USB nativa, descomente para o Serial sair por ela:
;build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
